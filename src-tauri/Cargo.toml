[package]
name = "control-ventas"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "control_ventas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Solo para los #[tokio::test] que ejercitan las funciones async contra una
# SQLite en memoria. No entra en el binario que se distribuye.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Misma versión que usa tauri-plugin-sql, para compartir el pool de conexiones.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
# Identidad de las filas para el futuro servidor central. v4 = aleatorio, que
# es lo correcto aquí: no queremos que el id revele fecha ni orden de alta.
uuid = { version = "1", features = ["v4"] }
# Hash de contraseñas. Argon2id es el default del crate y el recomendado hoy
# para contraseñas de usuario. La sal va dentro del propio string PHC, por eso
# no hay columna aparte para ella.
# La feature "std" es la que habilita OsRng (vía getrandom) para generar la sal.
argon2 = { version = "0.5", features = ["std"] }

